name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} - ${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        script:
          - format:check
          - lint
          - typecheck
          - build
          - test

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@3145eb8a7405dee53929e0c2495e26af7191daf0 # v2.6.4
        with:
          save-cache: ${{ matrix.script == 'lint' }} # the legs share one cache key

      - name: Run ${{ matrix.script }}
        run: pnpm run ${{ matrix.script }}

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    needs:
      - check
    permissions:
      actions: read # required to list the run's jobs
      contents: read # required to read the workflow file
    steps:
      - name: Check needed jobs
        uses: marcalexiei/github-actions/check-needs@3145eb8a7405dee53929e0c2495e26af7191daf0 # v2.6.4
        with:
          needs: ${{ toJSON(needs) }}
